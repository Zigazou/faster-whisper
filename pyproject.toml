[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chunked-faster-whisper"
version = "0.1.0"
description = "Transcribe audio files with Faster Whisper using overlapping chunks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["faster-whisper>=1.2,<2"]

[project.optional-dependencies]
diarization = ["pyannote.audio>=4,<5"]
alignment = ["whisperx>=3.8,<4"]

[project.scripts]
chunked-whisper = "chunked_whisper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
